<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Model Test</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        model-viewer { width: 100%; height: 500px; background-color: #f0f0f0; }
    </style>
</head>
<body>
    <h1>Testing GLB Model</h1>

        src="https://threejs.org/examples/models/gltf/Horse.glb" 
        camera-controls 
        auto-rotate 
        ar 
        style="width:100%; height:500px;">
    </model-viewer>
</body>
</html>
