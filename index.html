<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ahmed Hassan — Embedded Systems Engineer</title>
  <meta name="description" content="Portfolio of hardware design and embedded systems projects: PCB design, firmware, embedded Linux and IoT.">
  <meta property="og:title" content="Ahmed Hassan — Embedded Systems Engineer">
  <meta property="og:description" content="Hardware design & embedded systems portfolio.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3d2a'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='%23d8964f'/%3E%3Cpath d='M12 5v4M16 5v4M20 5v4M12 23v4M16 23v4M20 23v4M5 12h4M5 16h4M5 20h4M23 12h4M23 16h4M23 20h4' stroke='%23d8964f' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="bg-traces" aria-hidden="true"></div>

  <header class="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="brand"><span class="chip-logo" aria-hidden="true"></span><span id="brandName">Portfolio</span></a>
      <nav class="nav-links" aria-label="Main">
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <main id="top">
    <section class="hero wrap">
      <div class="hero-text">
        <p class="eyebrow mono" id="heroTagline"></p>
        <h1 id="heroName">&nbsp;</h1>
        <h2 class="hero-title" id="heroTitle"></h2>
        <p class="hero-summary" id="heroSummary"></p>
        <div class="hero-cta" id="heroCta"></div>
        <dl class="stats" id="stats"></dl>
      </div>
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 400 400" class="pcb-art">
          <defs>
            <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="var(--mask-2)"/><stop offset="1" stop-color="var(--mask)"/></linearGradient>
          </defs>
          <rect x="20" y="20" width="360" height="360" rx="22" fill="url(#g1)" stroke="var(--line)"/>
          <g class="traces" fill="none" stroke="var(--copper)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M60 80 H150 L170 100 V150"/><path d="M60 110 H130 L150 130 V150"/>
            <path d="M340 90 H270 L250 110 V150"/><path d="M340 300 H280 L250 270 V250"/>
            <path d="M60 300 H120 L150 270 V250"/><path d="M200 340 V250"/><path d="M230 60 V150"/><path d="M60 200 H150"/><path d="M250 200 H340"/>
          </g>
          <g fill="var(--copper)">
            <circle cx="60" cy="80" r="7"/><circle cx="60" cy="110" r="7"/><circle cx="340" cy="90" r="7"/><circle cx="340" cy="300" r="7"/>
            <circle cx="60" cy="300" r="7"/><circle cx="200" cy="340" r="7"/><circle cx="230" cy="60" r="7"/><circle cx="60" cy="200" r="7"/><circle cx="340" cy="200" r="7"/>
          </g>
          <rect x="140" y="140" width="120" height="120" rx="10" fill="#141414" stroke="#2c2c2c"/>
          <circle cx="158" cy="158" r="5" fill="#2c2c2c"/>
          <text x="200" y="205" text-anchor="middle" class="art-label">MCU</text>
          <g class="pulse" fill="var(--signal)"><circle r="4"><animateMotion dur="3.2s" repeatCount="indefinite" path="M60 80 H150 L170 100 V150"/></circle>
            <circle r="4"><animateMotion dur="2.6s" repeatCount="indefinite" path="M340 300 H280 L250 270 V250"/></circle>
            <circle r="4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M250 200 H340"/></circle></g>
        </svg>
      </div>
    </section>

    <section id="projects" class="section wrap">
      <div class="section-head">
        <div>
          <p class="eyebrow mono">// 01 — work</p>
          <h2>Projects</h2>
        </div>
        <label class="search">
          <span class="sr-only">Search projects</span>
          <input id="search" type="search" placeholder="Search projects, MCUs, tools…" autocomplete="off">
        </label>
      </div>
      <div class="filters" id="filters" role="toolbar" aria-label="Filter by category"></div>
      <div class="grid" id="grid" aria-live="polite"></div>
      <p class="empty" id="empty" hidden>No projects match your filter.</p>
    </section>

    <section id="skills" class="section wrap">
      <p class="eyebrow mono">// 02 — stack</p>
      <h2>Skills</h2>
      <div class="skills" id="skillsGrid"></div>
    </section>

    <section id="experience" class="section wrap">
      <p class="eyebrow mono">// 03 — background</p>
      <h2>Experience &amp; Education</h2>
      <div class="exp-cols">
        <ol class="timeline" id="timeline"></ol>
        <div>
          <h3 class="sub">Education</h3>
          <div id="education"></div>
          <h3 class="sub">Courses</h3>
          <ul class="courses" id="courses"></ul>
        </div>
      </div>
    </section>

    <section id="contact" class="section wrap contact">
      <p class="eyebrow mono">// 04 — contact</p>
      <h2>Let’s build something.</h2>
      <div class="contact-links" id="contactLinks"></div>
    </section>
  </main>

  <footer class="footer wrap mono"><span id="footName"></span> · <span id="year"></span></footer>

  <!-- Project modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">
      <button class="modal-close icon-btn" type="button" data-close aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </article>
  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
